<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Income_Expense_App</title>
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="ledger">
        <h2>Income & Expense Tracker</h2>
        <h4>Your Balance</h4>
        <h1 id="balance">₹0.00</h1>
        <div class="inc-exp-container">
          <div class="income-summary">
            <h4>Income</h4>
            <p id="inc_amt" class="money plus">+₹0.00</p>
          </div>
          <div class="expense-summary">
            <h4>Expense</h4>
            <p id="exp_amt" class="money minus">-₹0.00</p>
          </div>
        </div>
        <form action="#" id="form">
          <div class="form-control">
            <label for="desc">Description</label>
            <input
              type="text"
              id="desc"
              placeholder="Enter description..."
              required
            />
          </div>
          <div class="form-control">
            <label for="amount"
              >Amount <br />(negative - expense, positive - income)</label
            >
            <input
              type="number"
              id="amount"
              placeholder="Enter amount..."
              step="0.01"
              required
            />
          </div>
          <button class="btn" type="submit">Add transaction</button>
        </form>
      </div>
      <section class="transaction" aria-labelledby="transactions-heading">
        <h3 id="transactions-heading">Recent Transactions</h3>
        <ul id="trans" class="trans"></ul>
      </section>
    </div>
    <script src="JS/script.js"></script>
  </body>
</html>
